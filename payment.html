<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Music - Premium Checkout</title>
    <!-- Razorpay Checkout SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .badge {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        h2 { font-size: 24px; margin-bottom: 10px; color: #f8fafc; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        .price-box {
            background: #0f172a;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid #1e293b;
        }
        .price { font-size: 32px; font-weight: bold; color: #38bdf8; }
        .pay-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .pay-btn:hover { background: #0284c7; color: #fff; }
        .footer-note { font-size: 11px; color: #64748b; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <span class="badge">VIP Diamond Pass</span>
        <h2>Aura Music Premium</h2>
        <p>Unlock Studio Mastering, Zero Ads, and Unlimited Lossless Audio Downloads.</p>
        
        <div class="price-box">
            <span class="price">₹49</span>
            <span style="color:#64748b; font-size:14px;"> / Month</span>
        </div>

        <button id="pay-button" class="pay-btn">Proceed to Pay ₹49</button>
        <p class="footer-note">Secured by Razorpay • UPI, Cards & Net Banking Supported</p>
    </div>

    <script>
    document.getElementById('pay-button').onclick = function(e) {
        e.preventDefault();

        var options = {
            // ⚠️ LIVE MODE-এর সময় নিচে rzp_live_... কিস্ট্রিং বসাবেন
            "key": "rzp_test_Ta2gp20Cxs8c6N", 
            "amount": "4900", // ৪৯.০০ টাকা (পয়সায় হিসাব: ৪৯ x ১০০ = ৪৯০০)
            "currency": "INR",
            "name": "Aura Music",
            "description": "VIP Diamond Subscription",
            "image": "https://aura-music-dev.netlify.app/logo.png",
            "handler": function (response) {
                // পেমেন্ট সফল হলে কেবল এই ব্লকটি কাজ করবে
                alert("Payment Successful!\nPayment ID: " + response.razorpay_payment_id);
                
                // অ্যাপের ভেতরে সফল স্ট্যাটাস জানানোর জন্য রিডাইরেক্ট করতে পারেন
                window.location.href = "https://aura-music-dev.netlify.app/?status=success&payment_id=" + response.razorpay_payment_id;
            },
            "prefill": {
                "email": "baruiavijit72@gmail.com"
            },
            "theme": {
                "color": "#38bdf8"
            },
            "modal": {
                "ondismiss": function() {
                    alert("Payment attempt was cancelled.");
                }
            }
        };

        var rzp = new Razorpay(options);
        
        // পেমেন্ট ফেইল বা ত্রুটি দেখা দিলে
        rzp.on('payment.failed', function (response){
            alert("Payment Failed!\nReason: " + response.error.description);
        });

        rzp.open();
    };
    </script>
</body>
</html>
