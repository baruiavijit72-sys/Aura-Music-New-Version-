name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        env:
          GRADLE_OPTS: "-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -Dkotlin.compiler.execution.strategy=in-process"
        run: ./gradlew assembleDebug --stacktrace --info --no-daemon -Dkotlin.compiler.execution.strategy=in-process

      - name: Prepare APK Artifacts
        if: always()
        run: |
          mkdir -p output_apk
          find app/build/outputs/apk -type f -name "*.apk" -exec cp {} output_apk/ \; || true
          if [ -f output_apk/app-debug.apk ]; then
            cp output_apk/app-debug.apk output_apk/AuraMusic-v1.0.apk
          fi
          ls -la output_apk/ || true

      - name: Upload Aura Music APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AuraMusic-v1.0-APK
          path: output_apk/*.apk
          retention-days: 14
