name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle script executable
        run: chmod +x gradlew 2>/dev/null || true

      - name: Setup Keystore & Environment
        run: |
          touch .env
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build Debug APK with Gradle
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          ./gradlew assembleDebug --info --stacktrace -x test -x lint -x check --no-daemon
          mkdir -p app/build/outputs/apk/debug
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AuraMusic.apk
          fi

      - name: Upload Aura Music APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraMusic-v1.0-APK
          path: app/build/outputs/apk/debug/AuraMusic.apk
