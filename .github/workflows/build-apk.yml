name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle script executable
        run: chmod +x gradlew 2>/dev/null || true

      - name: Build Debug APK with Gradle
        env:
          GRADLE_OPTS: "-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
        run: |
          ./gradlew clean assembleDebug --no-daemon --stacktrace --no-build-cache -x test -x lint -x check
          mkdir -p app/build/outputs/apk/debug
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AuraMusic.apk
          fi

      - name: Upload Aura Music APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AuraMusic-v1.0-APK
          path: |
            app/build/outputs/apk/debug/AuraMusic.apk
            app/build/outputs/apk/debug/*.apk
